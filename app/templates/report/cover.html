<div class="comp cover-block">
  <h1 class="cover-entity">{{ entity.legal_name }}</h1>
  {% if entity.legal_form_note %}
  <p class="cover-note">{{ entity.legal_form_note }}</p>
  {% endif %}
</div>
{% if block.get('cover.subtitle') %}
<p class="comp cover-subtitle is-editable"
   data-block-id="cover.subtitle"
   data-raw="{{ block['cover.subtitle'].raw | e }}">{{ block['cover.subtitle'].text }}</p>
{% endif %}
{% if block.get('cover.management') %}
<p class="comp cover-subtitle is-editable"
   data-block-id="cover.management"
   data-raw="{{ block['cover.management'].raw | e }}">{{ block['cover.management'].text }}</p>
{% endif %}
